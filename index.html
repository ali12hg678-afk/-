<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ali - The Void</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #030303;
            color: #d1d1d1;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* تأثير التموج والخلفية المرعبة */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 20;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 20px;
            max-width: 90%;
            border: 1px solid #1a0000;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.1);
            background: rgba(5, 5, 5, 0.85);
            border-radius: 4px;
        }

        h1 {
            font-size: 2.5rem;
            color: #ff1a1a;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.7), 0 0 20px rgba(255, 0, 0, 0.4);
            letter-spacing: 2px;
        }

        p {
            font-size: 1.2rem;
            color: #8c8c8c;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.1);
            animation: flicker 3s infinite;
        }

        /* تأثير وميض خفيف للنص */
        @keyframes flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
                opacity: 1;
            }
            20%, 24%, 55% {
                opacity: 0.4;
            }
        }

        /* تأثير ضبابي خفيف بالخلفية */
        .fog {
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(20,0,0,0.2) 0%, rgba(0,0,0,0.8) 70%);
            animation: pulse 6s ease-in-out infinite alternate;
            z-index: 1;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="fog"></div>

    <div class="container">
        <h1 id="glitch-name">Ali</h1>
        <p>welcome to the void 😈</p>
    </div>

    <script>
        // تأثير اهتزاز بسيط ومفاجئ للاسم لزيادة جو الرعب
        const nameEl = document.getElementById('glitch-name');
        setInterval(() => {
            if(Math.random() > 0.85) {
                nameEl.style.transform = `translate(${Math.random() * 4 - 2}px, ${Math.random() * 4 - 2}px)`;
                setTimeout(() => {
                    nameEl.style.transform = 'translate(0, 0)';
                }, 100);
            }
        }, 2000);
    </script>

</body>
</html>
